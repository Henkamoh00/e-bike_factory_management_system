name: CI

on:
  pull_request:
    branches: [ main, master ]
  push:
    branches: [ main, master ]

defaults:
  run:
    working-directory: backend

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install Poetry
        uses: snok/install-poetry@v1
        with:
          version: latest
          virtualenvs-create: true
          virtualenvs-in-project: true

      - name: Cache Poetry virtualenv
        uses: actions/cache@v4
        with:
          path: backend/.venv
          key: ${{ runner.os }}-poetry-${{ hashFiles('backend/poetry.lock') }}
          restore-keys: |
            ${{ runner.os }}-poetry-

      - name: Install dependencies
        run: poetry install --no-interaction --no-root

      - name: Run flake8 (linting)
        run: poetry run flake8 . --count --show-source --statistics

      - name: Run pytest (main suite)
        run: poetry run pytest test_suite/ -v --tb=short
        env:
          PYTHONIOENCODING: utf-8

      - name: Run pytest (invoices suite)
        run: poetry run pytest test_suite_invoices/ -v --tb=short
        env:
          PYTHONIOENCODING: utf-8