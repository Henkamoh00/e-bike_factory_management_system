[project]
name = "backend"
version = "0.1.0"
description = ""
authors = [
    {name = "henka",email = "henkamoh@gmail.com"}
]
requires-python = ">=3.10,<4.0"
dependencies = [
    "fastapi (>=0.139.0,<0.140.0)",
    "uvicorn[standard] (>=0.49.0,<0.50.0)",
    "sqlalchemy (>=2.0.51,<3.0.0)",
    "alembic (>=1.18.5,<2.0.0)",
    "psycopg2-binary (>=2.9.12,<3.0.0)",
    "pydantic (>=2.13.4,<3.0.0)",
    "python-dotenv (>=1.2.2,<2.0.0)",
    "python-jose[cryptography] (>=3.5.0,<4.0.0)",
    "python-multipart (>=0.0.32,<0.0.33)",
    "bcrypt (==4.0.1)",
    "slowapi (>=0.1.10,<0.2.0)",
    "redis (>=8.1.0,<9.0.0)",
    "pytest (>=9.1.1,<10.0.0)",
    "httpx (>=0.28.1,<0.29.0)",
    "flake8 (>=7.3.0,<8.0.0)",
    "reportlab (>=5.0.1,<6.0.0)",
    "arabic-reshaper (>=3.0.1,<4.0.0)",
    "python-bidi (>=0.6.11,<0.7.0)",
    "qrcode[pil] (>=8.2,<9.0)"
]

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[dependency-groups]
dev = [
    "autopep8 (>=2.3.2,<3.0.0)",
    "httpx2 (>=2.13.0,<3.0.0)"
]